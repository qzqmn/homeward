<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- PWA：讓瀏覽器知道可以「加到主畫面」、全螢幕獨立視窗啟動 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e88a2d" />

    <!-- iOS Safari 不吃 manifest.json 的大部分欄位，「加到主畫面」要另外靠這幾個標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="歸途" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- PWA：註冊 Service Worker（快取靜態外殼而已；API/媒體一律走網路，
         離線送出的線索/軌跡由 app 內建的 IndexedDB 佇列處理） -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // SW 註冊失敗不影響一般使用（例如 file:// 或私密瀏覽模式）：
            // 只少掉離線外殼，app 主流程完全照常。
          });
        });
      }
    </script>
  </body>
</html>
