# 歸途 Homeward — Docker Compose
# 部署位置：/docker-data/homeward/
# 正式部署：映像由 GitHub Actions 建置並推送到 GHCR，VPS 只需 pull（見 deploy.sh）
# 本機自建映像：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: homeward

services:
  # ---------- Go API ----------
  backend-go:
    image: ghcr.io/${GH_OWNER:?請在 .env 設定 GH_OWNER}/homeward-backend:${IMAGE_TAG:-latest}
    container_name: homeward-backend
    restart: unless-stopped
    # 以 NAS 目錄擁有者的 UID/GID 運行，確保 Go 有權限寫入 /mnt/nas/homeward-media
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      GIN_MODE: release
      PORT: "8080"
      MEDIA_DIR: /data/media
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      NOTIFY_INTERVAL_SEC: ${NOTIFY_INTERVAL_SEC:-300}
      # 上傳單檔上限（MB，MAX_UPLOAD_MB），超過會被後端擋掉
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      # 志願者軌跡保留天數（TRACK_RETENTION_DAYS）：已結案案件結案滿 N 天，背景排程刪除軌跡
      TRACK_RETENTION_DAYS: ${TRACK_RETENTION_DAYS:-}
      # 只用來驗證 Telegram Login 的簽章，不會拿去發訊息
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # bot 的 @username（不含 @），公開資訊，前端用它嵌入 Telegram 登入按鈕
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # 通知要送去哪裡由這個網址決定（例如你的 Cloudflare Worker）；
      # 空字串時後端只會把通知內容印到 log，不會真的發送
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # 名單內的 Telegram id 登入時自動升級為管理員（第一次部署不用跑 SQL）
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      POSTGRES_HOST: postgis-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_ADDR: redis-cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # 讀寫：Go 把上傳的照片寫進 NAS
      - /mnt/nas/homeward-media:/data/media
    depends_on:
      db-migrate:
        condition: service_completed_successfully   # schema 升級完成才啟動 API
      postgis-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks: [homeward-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- 資料庫 migration（一次性任務，跑完即退出）----------
  db-migrate:
    image: ghcr.io/${GH_OWNER:?請在 .env 設定 GH_OWNER}/homeward-migrate:${IMAGE_TAG:-latest}
    container_name: homeward-migrate
    restart: "no"
    # 資料庫密碼會直接放進連線網址，請只用字母數字（例如 openssl rand -hex 24 產生）
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis-db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgis-db:
        condition: service_healthy
    networks: [homeward-net]

  # ---------- PostgreSQL + PostGIS ----------
  postgis-db:
    # 官方 postgis/postgis 沒有 arm64 版本（在 ARM VPS，例如 Oracle Cloud 的 Ampere
    # 機型，會直接啟動失敗）。imresamu/postgis 是跟官方 postgis/docker-postgis 專案
    # 密切合作的維護者所出，明確支援 amd64+arm64，環境變數與官方 postgres 映像相容。
    image: imresamu/postgis:16-3.6-bookworm
    container_name: homeward-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [homeward-net]   # 不對外開 port，僅容器網路內可達
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis ----------
  redis-cache:
    image: redis:7-alpine
    container_name: homeward-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks: [homeward-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------- 資料庫備份（每日 pg_dump 到掛載目錄，保留 BACKUP_KEEP 份）----------
  # 部署時在 .env 設 BACKUP_DIR=/mnt/nas/homeward-backups（與媒體同一台 NAS）
  # 啟用；啟用前先 `chown` 給 PGID 的擁有者。還原：
  #   gunzip -c homeward-XXXX.sql.gz | docker exec -i homeward-postgis psql -U $POSTGRES_USER -d $POSTGRES_DB
  db-backup:
    image: imresamu/postgis:16-3.6-bookworm
    container_name: homeward-db-backup
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      POSTGRES_HOST: postgis-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_DIR: /backups
    volumes:
      - ./db/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgis-db:
        condition: service_healthy
    networks: [homeward-net]

  # ---------- Nginx：PWA 靜態檔 + 圖片直讀 + API 反代 ----------
  frontend-web:
    image: ghcr.io/${GH_OWNER:?請在 .env 設定 GH_OWNER}/homeward-frontend:${IMAGE_TAG:-latest}
    container_name: homeward-web
    restart: unless-stopped
    ports:
      # 想只允許 Tailscale 訪問，可在 .env 把 WEB_BIND 設為本機的 Tailscale IP
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    volumes:
      # PWA 靜態檔與 nginx.conf 已打包進映像；唯讀掛載 NAS，Nginx 直接讀圖，不經過 Go
      - /mnt/nas/homeward-media:/data/media:ro
    depends_on:
      backend-go:
        condition: service_healthy
    networks: [homeward-net]

  # ---------- Cloudflare Tunnel（選用）----------
  # 啟用：在 .env 設 COMPOSE_PROFILES=tunnel 與 TUNNEL_TOKEN=<Cloudflare 給的 token>。
  # 跟其他容器放在同一個 Docker 網路，所以 Cloudflare 儀表板的 Public Hostname
  # 服務網址要填 http://frontend-web:80 （容器內部網址），不是 localhost——
  # 在容器裡 localhost 指的是 cloudflared 自己，不是你的 VPS 主機。
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homeward-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend-web
    networks: [homeward-net]

networks:
  homeward-net:
    driver: bridge
