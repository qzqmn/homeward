server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 上傳上限（需 >= Go 端 MAX_UPLOAD_MB，預設 10MB）
    client_max_body_size 12m;

    # 1) 圖片：Nginx 直接讀取 NAS 掛載目錄（唯讀），不經 Go
    location /media/ {
        alias /data/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 若前面接了 Cloudflare（含 Tunnel），$remote_addr 會變成代理的 IP，限流會把所有人算成同一個！
    # 屆時請啟用下列設定，還原真實客戶端 IP（Tunnel 的來源 IP 請依實際網段調整）：
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 172.16.0.0/12;

    # 2) API：反向代理到 Go 後端（容器網路內以服務名解析）
    location /api/ {
        proxy_pass http://backend-go:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 覆蓋而非追加，防止客戶端偽造
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 3) 分享預覽頁：WhatsApp／Facebook／Telegram 等爬蟲讀取 OG meta 用，由 Go 直接吐 HTML
    # （爬蟲不會執行 SPA 的 JS，不能讓它落到下面的 try_files）。真人點擊會被該頁的
    # <meta http-equiv="refresh"> 立刻轉去 PWA。
    location /c/ {
        proxy_pass http://backend-go:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4) PWA：SPA 路由回落；index.html 不快取，確保更新即時生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
