server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 上傳上限（需 >= Go 端 MAX_UPLOAD_MB，預設 10MB）
    client_max_body_size 12m;

    # 1) 圖片：Nginx 直接讀取 NAS 掛載目錄（唯讀），不經 Go
    location /media/ {
        alias /data/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 使用 Cloudflare Tunnel：cloudflared 在 Cloudflare 邊緣節點收到請求後，會透過
    # 事先建立好的加密通道把請求轉送到跑在你 VPS 上的 cloudflared，再由它連到這個
    # Nginx——這段「cloudflared → Nginx」是在你自己的機器／網路內，不是從公開網際
    # 網路直接打進來，所以用私有網段 + Tailscale 網段來信任它即可，不需要列出
    # Cloudflare 公開的邊緣節點 IP 段（那是給「Cloudflare Proxy」架構用的，Tunnel
    # 用不到）。沒有這段設定，$remote_addr 會變成 cloudflared 的位址，所有訪客都會
    # 被限流器當成同一個來源。
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;      # cloudflared 直接裝在 VPS 主機上、走 localhost 連過來
    set_real_ip_from 172.16.0.0/12;  # cloudflared 若是另一個 Docker 容器，走 bridge 網路連過來
    set_real_ip_from 100.64.0.0/10;  # cloudflared 若是透過 Tailscale 連過來（CGNAT 網段）
    # 部署後可以查 Go 後端 log 印出的來源 IP 是不是訪客的真實 IP 來確認有沒有生效；
    # 如果 cloudflared 是從其他網段連過來，把對應網段加進上面幾行就好。

    # 2) API：反向代理到 Go 後端（容器網路內以服務名解析）
    location /api/ {
        proxy_pass http://backend-go:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 覆蓋而非追加，防止客戶端偽造
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 3) 分享預覽頁：WhatsApp／Facebook／Telegram 等爬蟲讀取 OG meta 用，由 Go 直接吐 HTML
    # （爬蟲不會執行 SPA 的 JS，不能讓它落到下面的 try_files）。真人點擊會被該頁的
    # <meta http-equiv="refresh"> 立刻轉去 PWA。
    location /c/ {
        proxy_pass http://backend-go:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3b) MapLibre 的 Web Worker（maplibre-gl-worker.mjs / maplibre-gl-shared.mjs）：
    # 瀏覽器載入 ES module 時要求回應的 Content-Type 必須是 JavaScript，否則 worker
    # 會靜默載入失敗、地圖整片空白。這裡明確指定，不依賴 nginx 版本內建的
    # mime.types 有沒有收錄 .mjs。另外刻意「不」走下面 location / 的
    # try_files 回落：檔案不存在時要直接 404，而不是回傳 index.html 假裝成 JS
    # （那會讓錯誤更難察覺）。檔名沒有雜湊，所以快取只給 1 天，升級 maplibre-gl
    # 後使用者最慢隔天就會拿到新檔。
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=86400";
    }

    # 4) PWA：SPA 路由回落；index.html 不快取，確保更新即時生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
